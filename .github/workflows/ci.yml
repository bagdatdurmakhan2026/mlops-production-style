name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q api src tests

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restaurant-ml-api .

      - name: Smoke-test API container
        run: |
          docker run -d --name restaurant-ml-api-test -p 8000:8000 restaurant-ml-api
          trap 'docker logs restaurant-ml-api-test; docker rm -f restaurant-ml-api-test' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/healthz
          prediction=$(curl --fail --silent \
            -H "Content-Type: application/json" \
            -d '{"features":[1200,1500]}' \
            http://127.0.0.1:8000/predict)
          python -c "import json,sys; assert isinstance(json.loads(sys.argv[1])['prediction'], (float,int))" "$prediction"
          curl --fail --silent \
            -H "Content-Type: application/json" \
            -d '{"features":[1000000000,1000000000]}' \
            http://127.0.0.1:8000/predict
          curl --fail --silent http://127.0.0.1:8000/metrics | grep -q restaurant_input_drift_total
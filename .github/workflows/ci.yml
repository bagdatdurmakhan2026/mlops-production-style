name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q api src scripts tests

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Build MLOps stack
        run: docker compose --profile tools build

      - name: Smoke-test MLOps stack
        run: |
          export GRAFANA_ADMIN_PASSWORD=local-demo-only
          docker compose up -d
          trap 'docker compose down -v' EXIT
          for endpoint in \
            http://127.0.0.1:8000/readyz \
            http://127.0.0.1:9090/-/healthy \
            http://127.0.0.1:3000/api/health \
            http://127.0.0.1:5000/health; do
            ready=0
            for attempt in {1..45}; do
              if curl --fail --silent "$endpoint" >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
          done

          curl --fail --silent http://127.0.0.1:8000/livez
          prediction=$(curl --fail --silent \
            -H "Content-Type: application/json" \
            -d '{"features":[1200,1500]}' \
            http://127.0.0.1:8000/predict)
          python -c "import json,sys; assert isinstance(json.loads(sys.argv[1])['prediction'], (float,int))" "$prediction"
          curl --fail --silent \
            -H "Content-Type: application/json" \
            -d '{"features":[1000000000,1000000000]}' \
            http://127.0.0.1:8000/predict
          for attempt in {1..30}; do
            query=$(curl --fail --silent \
              'http://127.0.0.1:9090/api/v1/query?query=restaurant_prediction_requests_total')
            if python -c "import json,sys; data=json.loads(sys.argv[1])['data']['result']; sys.exit(0 if data and float(data[0]['value'][1]) > 0 else 1)" "$query"; then
              break
            fi
            sleep 2
          done
          python -c "import json,sys; data=json.loads(sys.argv[1])['data']['result']; assert data and float(data[0]['value'][1]) > 0" "$query"
          curl --fail --silent --user "admin:$GRAFANA_ADMIN_PASSWORD" \
            'http://127.0.0.1:3000/api/search?query=Restaurant' \
            | grep -q 'Restaurant API'